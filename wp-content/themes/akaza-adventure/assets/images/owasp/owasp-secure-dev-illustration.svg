<svg xmlns="http://www.w3.org/2000/svg" width="760" height="610" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
  <title id="title">Secure application development illustration</title>
  <desc id="desc">Abstract developer security dashboard with code, shield, lock and deployment pipeline elements.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#16234D" flood-opacity=".14"/>
    </filter>
  </defs>
