  <rect x="76" y="156" width="350" height="292" rx="18" fill="#F6F8FC" stroke="#E0E6F0"/>
  <text x="102" y="194" font-family="monospace" font-size="15" fill="#7180A0">01</text>
  <text x="140" y="194" font-family="monospace" font-size="15" fill="#16234D">authorize(request);</text>
  <text x="102" y="230" font-family="monospace" font-size="15" fill="#7180A0">02</text>
  <text x="140" y="230" font-family="monospace" font-size="15" fill="#135DB7">validate(input);</text>
  <text x="102" y="266" font-family="monospace" font-size="15" fill="#7180A0">03</text>
  <text x="140" y="266" font-family="monospace" font-size="15" fill="#16234D">verify(dependency);</text>
  <text x="102" y="302" font-family="monospace" font-size="15" fill="#7180A0">04</text>
  <text x="140" y="302" font-family="monospace" font-size="15" fill="#135DB7">encrypt(data);</text>
  <text x="102" y="338" font-family="monospace" font-size="15" fill="#7180A0">05</text>
  <text x="140" y="338" font-family="monospace" font-size="15" fill="#16234D">monitor(event);</text>
